[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "padel-engine"
version = "0.1.0"
description = "Moteur de détection de rallyes de padel : annotations, évaluation, ingestion vidéo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
vision = ["onnxruntime", "opencv-python-headless", "scikit-learn"]

[project.scripts]
padel-engine = "padel_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/padel_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
