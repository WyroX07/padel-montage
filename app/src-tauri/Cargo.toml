[package]
name = "padel-montage"
version = "0.1.0"
description = "Padel Montage : prédécoupage automatique et montage de matchs de padel"
edition = "2021"
publish = false

[lib]
name = "padel_montage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
