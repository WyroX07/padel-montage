name: Appli

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Types et build
        run: npm run build
      - name: Tests
        run: npm test

  bureau:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Dépendances système de Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - run: npm run build
      - name: Format
        working-directory: app/src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: app/src-tauri
        run: cargo test

  # Installeur Windows à télécharger depuis l'onglet Actions (non signé).
  installeur-windows:
    runs-on: windows-latest
    needs: [interface, bureau]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - name: Construire l'installeur
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: padel-montage-windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
